# servicemonitor.yaml — Défi 2 : monitoring avec Prometheus + Grafana
# Prérequis (kube-prometheus-stack via Helm) :
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install monitoring prometheus-community/kube-prometheus-stack -n monitoring --create-namespace \
#     --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false
#   kubectl apply -f monitoring/servicemonitor.yaml
#
# Accès :
#   kubectl -n monitoring port-forward svc/monitoring-grafana 3001:80          -> http://localhost:3001
#   kubectl -n monitoring get secret monitoring-grafana -o jsonpath="{.data.admin-password}"  (base64)
#   kubectl -n monitoring port-forward svc/monitoring-kube-prometheus-prometheus 9090 -> http://localhost:9090
# Requête PromQL à tester : rate(http_requests_total[1m])
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: my-app
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: my-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
