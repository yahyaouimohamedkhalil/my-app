# secret.example.yaml — Défi 3 : gestion des secrets
# Ne jamais commiter de vraie valeur. Deux options :
#
# 1) En ligne de commande (recommandé, rien n'est écrit sur disque) :
#      kubectl create secret generic my-app-secret --from-literal=API_KEY=<votre-cle>
#
# 2) Copier ce fichier en k8s/secret.yaml (ignoré par .gitignore), remplir, puis :
#      kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: my-app-secret
type: Opaque
stringData:
  API_KEY: "change-me"
